<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset=utf-8>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>导师法术速查表</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:14px/1.65 "Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",Arial,Helvetica,sans-serif;
  color:#24292f;background:#f6f7fb;
}
a{color:#5b3fd6;text-decoration:none}
a:hover{color:#3f27a8;text-decoration:underline}

/* 顶部标题区 */
.hdr{
  background:linear-gradient(135deg,#5b3fd6 0%,#7a5cf0 55%,#9a7bff 100%);
  color:#fff;padding:16px 24px 14px;
}
.hdr h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.5px}
.hdr h1 small{font-size:12px;font-weight:400;opacity:.85;margin-left:8px;letter-spacing:0}
.hdr .sub{margin-top:5px;font-size:12px;opacity:.9}
.hdr .sub b{font-weight:600}

/* 面板 */
.panel{background:#fff;border:1px solid #e4e6ef;border-radius:8px;margin:14px 16px;padding:12px 14px}
.panel.tbl{padding:0;overflow:visible}
.toolbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:12px 14px;border-bottom:1px solid #eceef5;background:#fbfbff;
  border-radius:8px 8px 0 0;position:sticky;top:0;z-index:20;
}
#input{
  flex:1 1 260px;min-width:200px;padding:8px 12px;font-size:14px;
  border:1px solid #cfd3e2;border-radius:6px;background:#fff;color:#24292f;
}
#input:focus{outline:none;border-color:#7a5cf0;box-shadow:0 0 0 3px rgba(122,92,240,.15)}
.btn{
  padding:7px 14px;font-size:13px;border-radius:6px;cursor:pointer;
  border:1px solid #cfd3e2;background:#fff;color:#3d4257;
}
.btn:hover{border-color:#7a5cf0;color:#5b3fd6}
.btn.pri{background:#5b3fd6;border-color:#5b3fd6;color:#fff;font-weight:600}
.btn.pri:hover{background:#4a2fbd;color:#fff}
#count{margin-left:auto;font-size:13px;color:#6b7280;white-space:nowrap}
#count b{color:#5b3fd6;font-weight:700}

/* 筛选区 */
#filterDiv{padding:12px 14px 4px;display:block}
.fgroup{border:0;border-top:1px solid #eceef5;margin:0;padding:7px 0 9px}
.fgroup:first-child{border-top:0}
.fgroup legend{
  font-size:12.5px;font-weight:700;color:#4b32a3;
  padding:0 8px 0 0;letter-spacing:.5px;
}
.fgroup .allbtn{
  font-size:12px;padding:2px 9px;margin:0 8px 0 0;border-radius:5px;
  border:1px solid #d9dcea;background:#f6f7fb;color:#5b6274;cursor:pointer;
}
.fgroup .allbtn:hover{border-color:#7a5cf0;color:#5b3fd6;background:#f1edff}
.fgroup label{
  display:inline-block;margin:2px 10px 2px 0;white-space:nowrap;
  font-size:13px;color:#3d4257;cursor:pointer;
}
.fgroup input[type=checkbox]{vertical-align:-1px;margin-right:3px;cursor:pointer}
.fgroup label:hover{color:#5b3fd6}

/* 数据表 */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid #f0f1f6;vertical-align:middle}
thead th{
  background:#f1edff;color:#4b32a3;font-weight:700;font-size:12.5px;
  white-space:nowrap;border-bottom:1px solid #ddd6fb;position:sticky;top:0;z-index:10;
}
thead th:first-child{text-align:left;padding-left:14px}
tbody td.name{text-align:left;padding-left:14px;max-width:280px}
tbody tr:nth-child(even) td{background:#fafbff}
tbody tr:hover td{background:#f3efff}
td.lv,td.school,td.time,td.range,td.save,td.sr,td.book{white-space:nowrap}
td.lv{font-weight:600;color:#4b32a3}
td.name a{font-weight:600}
.small{color:#8b90a1;font-size:12px;font-weight:400}
.mono{font-size:12px;color:#6b7280}
.foot{padding:10px 16px 22px;font-size:12px;color:#8b90a1;line-height:1.8}
.foot code{background:#eef0f7;padding:1px 5px;border-radius:4px;color:#4b32a3}

/* 专长速查补充：长文本列左对齐 */
tbody td.txt{text-align:left;line-height:1.55}
tbody td.txt.pre{color:#4b5563}
.note{padding:0 16px 8px;font-size:12px;color:#8b90a1}
</style>
<script>
var DSH = {
  all: function () { return Array.prototype.slice.call(document.getElementsByTagName("tr")); },
  chosen: function (name) {
    var cb = document.getElementsByName(name), out = [];
    for (var i = 0; i < cb.length; i++) if (cb[i].checked) out.push(cb[i].value);
    return out;
  },
  hasAny: function (tags, list) {
    if (!list.length) return false;
    // 必须按「空格分隔的完整词元」比较：子串匹配会让 来源:UC 命中 来源:UCa、
    // 描述符:火 命中 描述符:火或水
    var padded = " " + tags + " ";
    for (var i = 0; i < list.length; i++) if (padded.indexOf(" " + list[i] + " ") !== -1) return true;
    return false;
  }
};
function search() {
  var inputEl = document.getElementById("input");
  var raw = inputEl && inputEl.value ? inputEl.value : "";
  var keyword = raw.toLowerCase().replace(/^[s　]+|[s　]+$/g, "");
  var groups = ["level", "school", "class", "source", "time", "comp", "special", "descriptor", "save", "range", "sr"];
  // 组名 -> 行标签前缀（标签用的是中文前缀，必须映射，否则永远匹配不上）
  var TAG = {
    level: "环阶", school: "学派", class: "职业", source: "来源", time: "时间",
    comp: "成分", special: "特殊", descriptor: "描述符", save: "豁免", range: "距离", sr: "抗力"
  };
  var sel = {};
  for (var g = 0; g < groups.length; g++) sel[groups[g]] = DSH.chosen(groups[g]);
  // 「职业 + 环阶」按交叉语义：同时勾选时，要求存在某个「职业(简称)环阶」精确配对
  // 两种页面都适用：主表用全局配对标签；职业页只用本职业的配对标签（由 selfClassAb 指定）
  // 特例：「无职业信息」的法术（原文未标注职业/环阶）没有配对标签，
  //        勾选该项时退回按它自己的「环阶」标签判断，否则默认全选状态下这类法术会被全部挡掉
  function checkPairs(tags, pairs) {
    if (!pairs.length) return true;
    var padded = " " + tags + " ";
    for (var p = 0; p < pairs.length; p++) {
      if (padded.indexOf(" 阶:" + pairs[p].cls + pairs[p].lv + " ") !== -1) return true;
      if (pairs[p].cls === "无职业信息"
        && padded.indexOf(" 职业:无职业信息 ") !== -1
        && padded.indexOf(" 环阶:" + pairs[p].lv + " ") !== -1) return true;
    }
    return false;
  }
  var pairs = [];
  if (sel["class"] && sel["class"].length && sel["level"] && sel["level"].length) {
    for (var a = 0; a < sel["class"].length; a++) {
      for (var b = 0; b < sel["level"].length; b++) {
        pairs.push({ cls: sel["class"][a], lv: sel["level"][b] });
      }
    }
  } else if ((DSH.selfClassAb || DSH.selfClass) && sel["level"] && sel["level"].length) {
    var sc = DSH.selfClassAb || DSH.selfClass;
    for (var b2 = 0; b2 < sel["level"].length; b2++) pairs.push({ cls: sc, lv: sel["level"][b2] });
  }
  var rows = DSH.all();
  var shown = 0;
  for (var i = 0; i < rows.length; i++) {
    var tr = rows[i];
    var tags = tr.getAttribute("tags");
    if (tags === null) continue;            // 表头
    var ok = true;
    if (keyword) {
      var hay = (tr.getAttribute("spell") || "") + " " + (tr.getAttribute("trad") || "") + " " + (tr.getAttribute("en") || "");
      if (hay.toLowerCase().indexOf(keyword) === -1) ok = false;
    }
    if (ok) {
      for (var g = 0; g < groups.length; g++) {
        var name = groups[g];
        if (pairs.length && (name === "class" || name === "level")) continue;  // 交由配对判断
        var list = sel[name];
        if (!list.length) continue;          // 该分类未勾选任何项 -> 不参与过滤
        // 必须用中文标签前缀：行标签是「前缀:取值」形式
        var want = [];
        for (var q = 0; q < list.length; q++) want.push(TAG[name] + ":" + list[q]);
        if (!DSH.hasAny(tags, want)) { ok = false; break; }
      }
    }
    if (ok && pairs.length && !checkPairs(tags, pairs)) ok = false;
    tr.style.display = ok ? "" : "none";
    if (ok) shown++;
  }
  document.getElementById("count").innerHTML = "显示 <b>" + shown + "</b> / " + (rows.length - 1) + " 条";
}
function select_all(type_name) {
  var cb = document.getElementsByName(type_name);
  var all = true;
  for (var i = 0; i < cb.length && all; i++) if (!cb[i].checked) all = false;
  for (var i = 0; i < cb.length; i++) cb[i].checked = !all;
  search();
}
function none_all(type_name) {
  var cb = document.getElementsByName(type_name);
  for (var i = 0; i < cb.length; i++) cb[i].checked = false;
  search();
}
function toggleVisibility() {
  var div = document.getElementById("filterDiv");
  var btn = document.getElementById("toggleBtn");
  var hidden = (div.style.display === "none") || (div.offsetHeight === 0);
  if (hidden) { div.style.display = "block"; btn.innerText = "隐藏筛选"; }
  else { div.style.display = "none"; btn.innerText = "显示筛选"; }
}
function resetAll() {
  var cb = document.getElementsByTagName("input");
  for (var i = 0; i < cb.length; i++) if (cb[i].type === "checkbox") cb[i].checked = true;
  document.getElementById("input").value = "";
  search();
}
</script>
</head>
<body>
<div class="hdr">
  <h1>导师法术速查表<small>3 条</small></h1>
  <div class="sub"><a href="spellindex.html" style="color:#fff;text-decoration:underline">&#8592; 返回万法大全速查表</a></div>
</div>
<script>DSH.selfClass = "导师"; DSH.selfClassAb = "导";</script>

<div class="panel tbl">
  <div class="toolbar">
    <input id="input" placeholder="搜索法术名（简 / 繁 / 英文均可）…" onkeyup="if(event.keyCode===13)search()">
    <button type="button" class="btn pri" onclick="search()">搜索</button>
    <button type="button" class="btn" onclick="toggleVisibility()" id="toggleBtn">隐藏筛选</button>
    <span id="count"></span>
  </div>
  <div id="filterDiv"><fieldset class="fgroup"><legend>本职业环阶</legend><button type="button" class="allbtn" onclick="select_all('level')">全选</button><button type="button" class="allbtn" onclick="none_all('level')">全不选</button><input type="checkbox" id="level_0" name="level" value="1" checked><label for="level_0">1环</label><input type="checkbox" id="level_1" name="level" value="2" checked><label for="level_1">2环</label></fieldset><fieldset class="fgroup"><legend>学派</legend><button type="button" class="allbtn" onclick="select_all('school')">全选</button><button type="button" class="allbtn" onclick="none_all('school')">全不选</button><input type="checkbox" id="school_0" name="school" value="死灵" checked><label for="school_0">死灵</label><input type="checkbox" id="school_1" name="school" value="变化" checked><label for="school_1">变化</label></fieldset><fieldset class="fgroup"><legend>来源书</legend><button type="button" class="allbtn" onclick="select_all('source')">全选</button><button type="button" class="allbtn" onclick="none_all('source')">全不选</button><input type="checkbox" id="source_0" name="source" value="ARG" checked><label for="source_0">ARG · 进阶种族手册</label><input type="checkbox" id="source_1" name="source" value="ISG" checked><label for="source_1">ISG · 内海诸神</label></fieldset></div>
  <table>
  <thead>
    <tr><th class="thname">法术名</th><th>环阶</th><th>学派</th><th>时间</th><th>距离</th><th>持续时间</th><th>豁免</th><th>来源</th></tr>
  </thead>
  <tbody>
<tr tags="学派:死灵 描述符:死亡 描述符:邪恶 时间:整轮动作 距离:接触 来源:ARG 成分:无言语 成分:无姿势 成分:材料 成分:无器材 成分:无价耗 特殊:不可解消 特殊:专注 特殊:非领域法术 豁免:无 抗力:可 环阶:2 阶:导2" spell="噬心术" trad="噬心术" en="Enemy&#39;s Heart"><td class="name"><a href="Spell%20ARG.lookup.html#sp-Enemy_s_Heart">噬心术 Enemy's Heart</a></td><td class="lv">2环</td><td class="school">死灵</td><td class="time">1个整轮动作，特殊见下文</td><td class="range">接触</td><td>专注/每受术者HD1分钟；见详述</td><td class="save">无</td><td class="book">ARG</td></tr>
<tr tags="学派:变化 描述符:无描述符 时间:标准动作 距离:接触 来源:ISG 成分:无言语 成分:无姿势 成分:无材料 成分:无器材 成分:无价耗 特殊:不可解消 特殊:无专注 特殊:非领域法术 豁免:强韧 抗力:可 环阶:1 阶:导1" spell="吞噬者假面" trad="吞噬者假面" en="Face of the Devourer"><td class="name"><a href="Spell%20ISG.lookup.html#sp-Face_of_the_Devourer">吞噬者假面 Face of the Devourer</a></td><td class="lv">1环</td><td class="school">变化</td><td class="time">1个标准动作</td><td class="range">接触</td><td>1分钟/等级</td><td class="save">强韧通过则无效（无害）</td><td class="book">ISG</td></tr>
<tr tags="学派:变化 描述符:无描述符 时间:标准动作 距离:特殊 来源:ISG 成分:无言语 成分:无姿势 成分:无材料 成分:无器材 成分:无价耗 特殊:不可解消 特殊:无专注 特殊:非领域法术 豁免:无 抗力:可 环阶:2 阶:导2" spell="洛瓦古格之怒" trad="洛瓦古格之怒" en="Rovagug&#39;s Fury"><td class="name"><a href="Spell%20ISG.lookup.html#sp-Rovagug_s_Fury">洛瓦古格之怒 Rovagug's Fury</a></td><td class="lv">2环</td><td class="school">变化</td><td class="time">1个标准动作</td><td class="range">30尺</td><td>立即</td><td class="save">无</td><td class="book">ISG</td></tr>
</tbody>
  </table>
</div>

<div class="foot">
  数据来源：Pathfinder 1 版繁中合集「法术」章节。本页仅为检索索引，正文一字未改；
  点击法术名将跳转至对应的<b>原文伴生页</b>并定位到该条目。
</div>
<script>try { search(); } catch (e) { }</script>
</body>
</html>
