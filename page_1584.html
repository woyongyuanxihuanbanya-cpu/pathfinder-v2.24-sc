<P><SPAN class=bbc_size style="FONT-SIZE: 14pt"><SPAN class=bbc_color 
style="COLOR: purple"><STRONG>速饮者</STRONG></SPAN>(Accelerated Drinker) <SPAN 
class=bbc_color style="COLOR: red">出自《Cheliax, Empire of Devils》</SPAN><BR><SPAN 
class=bbc_color style="COLOR: purple"><STRONG>分类 
</STRONG></SPAN>基础（战斗）<BR><STRONG><SPAN class=bbc_color style="COLOR: purple">效果 
</SPAN></STRONG>你知道如何有效饮用一瓶药水，比如不使用你的手，把药瓶扔到空中然后用你的嘴接住，或者用你的牙齿打开瓶子。只要在你回合开始的时候你手中拿着药水，你就可以用一个移动动作而非标准动作饮用这瓶药水。</SPAN></P></BODY></HTML>
